# Palette: {{ theme }} (generated; edits are overwritten on the next switch)
# Every line is `set -gq <option>`: `palette init --remove` unsets exactly these.
set -gq status-style "bg=default,fg={{ foreground }}"
set -gq status-left-style "fg={{ accent }},bold"
set -gq status-right-style "fg={{ dark_foreground }}"
set -gq window-status-style "fg={{ dark_foreground }}"
set -gq window-status-current-style "fg={{ accent }},bold"
set -gq window-status-activity-style "fg={{ yellow }}"
set -gq window-status-bell-style "fg={{ red }},bold"
set -gq pane-border-style "fg={{ muted }}"
set -gq pane-active-border-style "fg={{ accent }}"
set -gq message-style "bg={{ selection }},fg={{ foreground }}"
set -gq message-command-style "bg={{ selection }},fg={{ foreground }}"
set -gq mode-style "bg={{ selection }},fg={{ bright_foreground }}"
set -gq copy-mode-match-style "bg={{ yellow }},fg={{ background }}"
set -gq copy-mode-current-match-style "bg={{ orange }},fg={{ background }}"
set -gq popup-border-style "fg={{ accent }}"
set -gq menu-border-style "fg={{ accent }}"
set -gq menu-selected-style "bg={{ selection }},fg={{ bright_foreground }}"
set -gq display-panes-colour "{{ muted }}"
set -gq display-panes-active-colour "{{ accent }}"
set -gq clock-mode-colour "{{ accent }}"
