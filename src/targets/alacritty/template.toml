# Generated by palette from theme "{{ theme }}". Edits are overwritten on the next switch.
# Use from alacritty.toml:
#   [general]
#   import = ["~/.config/palette/current/alacritty.toml"]

[colors.primary]
background = "{{ background }}"
foreground = "{{ foreground }}"

[colors.cursor]
text = "{{ background }}"
cursor = "{{ bright_foreground }}"

[colors.selection]
text = "{{ bright_foreground }}"
background = "{{ selection }}"

[colors.normal]
black = "{{ ansi[0] }}"
red = "{{ ansi[1] }}"
green = "{{ ansi[2] }}"
yellow = "{{ ansi[3] }}"
blue = "{{ ansi[4] }}"
magenta = "{{ ansi[5] }}"
cyan = "{{ ansi[6] }}"
white = "{{ ansi[7] }}"

[colors.bright]
black = "{{ ansi[8] }}"
red = "{{ ansi[9] }}"
green = "{{ ansi[10] }}"
yellow = "{{ ansi[11] }}"
blue = "{{ ansi[12] }}"
magenta = "{{ ansi[13] }}"
cyan = "{{ ansi[14] }}"
white = "{{ ansi[15] }}"
