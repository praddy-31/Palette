# Generated by palette from theme "{{ theme }}". Edits are overwritten on the next switch.
# Loaded from fuzzel.ini by an include= line Palette added at its top.
[colors]
background={{ background | bare }}f2
text={{ foreground | bare }}ff
prompt={{ accent | bare }}ff
placeholder={{ muted | bare }}ff
input={{ foreground | bare }}ff
match={{ accent | bare }}ff
selection={{ selection | bare }}ff
selection-text={{ selection | ink(darker_background, bright_foreground) | bare }}ff
selection-match={{ accent | bare }}ff
counter={{ muted | bare }}ff
border={{ accent | bare }}ff
