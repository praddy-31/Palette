# Generated by palette from theme "{{ theme }}". Edits are overwritten on the next switch.
# Use from your Ghostty config (after any `theme =` line):
#   config-file = ~/.config/palette/current/ghostty.conf

background = {{ background }}
foreground = {{ foreground }}
cursor-color = {{ bright_foreground }}
cursor-text = {{ background }}
selection-background = {{ selection }}
selection-foreground = {{ bright_foreground }}
{% for colour in ansi %}
palette = {{ loop.index0 }}={{ colour }}
{%- endfor %}
