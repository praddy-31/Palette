# Generated by palette from theme "{{ theme }}". Edits are overwritten on the next switch.
# Use from your Ghostty config (after any `theme =` line):
#   config-file = ~/.config/palette/current/ghostty.conf

background = {{ background }}
foreground = {{ foreground }}
cursor-color = {{ bright_foreground }}
cursor-text = {{ background }}
selection-background = {{ selection }}
selection-foreground = {{ bright_foreground }}
{% for colour in ansi %}
palette = {{ loop.index0 }}={{ colour }}
{%- endfor %}
{% set g = glass.ghostty -%}
{% if g.kind != "own" %}
# Window glass, from Palette (Settings → Apps → Ghostty, or `palette glass ghostty`).
# These win over your own lines above. On macOS, a new opacity shows once Ghostty is
# quit and reopened.
background-opacity = {{ g.opacity }}
background-blur = {% if g.kind == "liquid-glass" %}macos-glass-regular{% elif g.kind == "liquid-clear" %}macos-glass-clear{% elif g.blur > 0 %}{{ g.blur }}{% else %}false{% endif %}
{% endif -%}
