# Generated by palette from theme "{{ theme }}". Edits are overwritten on the next switch.
# Use from kitty.conf:
#   include ~/.config/palette/current/kitty.conf

foreground {{ foreground }}
background {{ background }}
selection_foreground {{ bright_foreground }}
selection_background {{ selection }}
cursor {{ bright_foreground }}
cursor_text_color {{ background }}
url_color {{ accent }}

active_border_color {{ accent }}
inactive_border_color {{ muted }}
active_tab_foreground {{ background }}
active_tab_background {{ accent }}
inactive_tab_foreground {{ foreground }}
inactive_tab_background {{ lighter_background }}
{% for colour in ansi %}
color{{ loop.index0 }} {{ colour }}
{%- endfor %}
{% set g = glass.kitty -%}
{% if g.kind != "own" %}
# Window glass, from Palette (Settings → Apps → kitty, or `palette glass kitty`).
# kitty changes opacity on reload only if it started with dynamic_background_opacity,
# so the first time, quit and reopen it.
background_opacity {{ g.opacity }}
dynamic_background_opacity yes
background_blur {% if g.blur > 64 %}64{% else %}{{ g.blur }}{% endif %}
{% endif -%}
