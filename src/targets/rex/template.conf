# Generated by palette from theme "{{ theme }}". Rex imports this as its theme "palette".
# mode: {{ mode }}
background = {{ background }}
foreground = {{ foreground }}
cursor-color = {{ bright_foreground }}
cursor-text = {{ background }}
selection-background = {{ selection }}
selection-foreground = {{ bright_foreground }}
{% for colour in ansi %}
palette = {{ loop.index0 }}={{ colour }}
{%- endfor %}
