# Generated by palette from theme "{{ theme }}". Edits are overwritten on the next switch.
# Loaded from foot.ini by an include= line Palette added at its top.
[colors]
foreground={{ foreground | bare }}
background={{ background | bare }}
selection-foreground={{ selection | ink(darker_background, bright_foreground) | bare }}
selection-background={{ selection | bare }}
urls={{ accent | bare }}
{%- for colour in ansi %}
{%- if loop.index0 < 8 %}
regular{{ loop.index0 }}={{ colour | bare }}
{%- else %}
bright{{ loop.index0 - 8 }}={{ colour | bare }}
{%- endif %}
{%- endfor %}
