[palettes.palette]
accent = "{{ accent }}"
selection = "{{ selection }}"
muted = "{{ muted }}"
background = "{{ background }}"
dark_background = "{{ dark_background }}"
darker_background = "{{ darker_background }}"
lighter_background = "{{ lighter_background }}"
foreground = "{{ foreground }}"
dark_foreground = "{{ dark_foreground }}"
light_foreground = "{{ light_foreground }}"
bright_foreground = "{{ bright_foreground }}"
red = "{{ red }}"
orange = "{{ orange }}"
yellow = "{{ yellow }}"
green = "{{ green }}"
cyan = "{{ cyan }}"
blue = "{{ blue }}"
magenta = "{{ magenta }}"
purple = "{{ magenta }}"
brown = "{{ brown }}"
bright_red = "{{ bright_red }}"
bright_yellow = "{{ bright_yellow }}"
bright_green = "{{ bright_green }}"
bright_cyan = "{{ bright_cyan }}"
bright_blue = "{{ bright_blue }}"
bright_magenta = "{{ bright_magenta }}"
# The names starship's own presets use, so a preset copied from starship.rs
# follows the theme without editing. Catppuccin Powerline:
rosewater = "{{ bright_red }}"
flamingo = "{{ bright_red }}"
pink = "{{ bright_magenta }}"
mauve = "{{ magenta }}"
maroon = "{{ bright_red }}"
peach = "{{ orange }}"
teal = "{{ cyan }}"
sky = "{{ bright_cyan }}"
sapphire = "{{ bright_blue }}"
lavender = "{{ accent }}"
text = "{{ foreground }}"
subtext1 = "{{ light_foreground }}"
subtext0 = "{{ dark_foreground }}"
overlay2 = "{{ dark_foreground }}"
overlay1 = "{{ muted }}"
overlay0 = "{{ muted }}"
surface2 = "{{ selection }}"
surface1 = "{{ lighter_background }}"
surface0 = "{{ lighter_background }}"
base = "{{ background }}"
mantle = "{{ dark_background }}"
crust = "{{ darker_background }}"
# Gruvbox Rainbow:
color_fg0 = "{{ bright_foreground }}"
color_bg1 = "{{ lighter_background }}"
color_bg3 = "{{ selection }}"
color_blue = "{{ blue }}"
color_aqua = "{{ cyan }}"
color_green = "{{ green }}"
color_orange = "{{ orange }}"
color_purple = "{{ magenta }}"
color_red = "{{ red }}"
color_yellow = "{{ yellow }}"
# Colours chosen by how the theme looks, not by name (see docs/THEME_SPEC.md):
# family1-6 belong together (family1 = the accent), pop/pop2 stand apart.
# primary/secondary/tertiary = family1-3, for a three-colour prompt.
primary = "{{ primary }}"
secondary = "{{ secondary }}"
tertiary = "{{ tertiary }}"
{% for c in family %}family{{ loop.index }} = "{{ c }}"
{% endfor %}pop = "{{ pop }}"
pop2 = "{{ pop2 }}"
# Readable text on each of those as a background (dark or light ink).
on_primary = "{{ primary | ink(darker_background, bright_foreground) }}"
on_secondary = "{{ secondary | ink(darker_background, bright_foreground) }}"
on_tertiary = "{{ tertiary | ink(darker_background, bright_foreground) }}"
{% for c in family %}on_family{{ loop.index }} = "{{ c | ink(darker_background, bright_foreground) }}"
{% endfor %}
