[package]
name = "palette-app"
version = "1.3.0"
edition = "2024"
license = "MIT"
description = "Palette's menu bar picker and quick-switch overlay"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
palette = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Hearing "an app started" from macOS (`launches.rs`). The same crates Tauri already builds
# on the Mac, so the app doesn't grow (DECISIONS 2026-11-17).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSString", "NSDictionary"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSWorkspace", "NSRunningApplication"] }
