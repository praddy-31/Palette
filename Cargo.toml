[package]
name = "palette"
version = "1.1.0"
edition = "2024"
description = "Omarchy-style theme switcher for macOS"
license = "MIT"

# The Tauri app lives in app/ and links this crate as a library.
# `cargo test` here still builds and tests only the core.
[workspace]
members = [".", "app"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
minijinja = "3.0.0"
serde = { version = "1", features = ["derive"] }
toml = "1.1.8"
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3.27.0"

# Small, fast binary: whole-program optimisation, symbols stripped.
# Leaner debug builds (measured: a fresh workspace build 2.0 → 1.5 GB):
# dependencies without debug info, our own code with line numbers only, so
# panics and backtraces still point at file:line. Release builds unchanged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
